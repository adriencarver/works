<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Adrien Carver, author.">
    <title>Adrien Carver | Author</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 0;
            color: #ffffff;
            background-color: #000000;
        }

        .page {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
            box-sizing: border-box;
            text-align: center;
        }

        blockquote {
            max-width: 560px;
            margin: 0 0 48px 0;
            font-style: italic;
            line-height: 1.7;
            font-size: 1.1em;
        }

        .attribution {
            display: block;
            margin-top: 16px;
            font-style: normal;
            color: #888888;
            font-size: 0.9em;
        }

        .links a {
            color: #ffffff;
            text-decoration: none;
            border-bottom: 1px solid #888888;
            margin: 0 14px;
            letter-spacing: 1px;
        }

        .links a:hover {
            border-bottom-color: #ffffff;
        }

        .name {
            margin-top: 48px;
            color: #888888;
            font-size: 0.85em;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="page">
        <blockquote>
            A great fire burns within me, but no one stops to warm themselves at it, and passers-by only see a wisp of smoke.
            <span class="attribution">&mdash; Vincent Van Gogh</span>
        </blockquote>

        <div class="links">
            <a href="[YOUR SUBSTACK URL]">substack</a>
            <a href="[YOUR INSTAGRAM URL]">instagram</a>
            <a href="mailto:[YOUR EMAIL]">email</a>
        </div>

        <div class="name">Adrien Carver</div>
    </div>

</body>
</html>
